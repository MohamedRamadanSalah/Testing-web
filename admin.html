<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delizioso Admin - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-page">
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-content">
                <div class="admin-logo">
                    <i class="fas fa-cog"></i>
                    <h1>Admin Dashboard</h1>
                </div>
                <nav class="admin-nav">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-home"></i> Back to Site
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Dashboard Content -->
    <main class="admin-main">
        <div class="container">
            <!-- Stats Cards -->
            <section class="stats-section">
                <div class="section-header">
                    <h2>Dashboard Overview</h2>
                    <p>Real-time statistics and performance metrics</p>
                </div>

                <div class="stats-grid" id="statsGrid">
                    <!-- Stats will be loaded here by JavaScript -->
                </div>
            </section>

            <!-- Charts Section -->
            <section class="charts-section">
                <div class="chart-container">
                    <h3>Weekly Performance</h3>
                    <div class="chart-placeholder">
                        <i class="fas fa-chart-line"></i>
                        <span>Sales Chart</span>
                        <div class="chart-bars">
                            <div class="chart-bar" style="height: 60%"></div>
                            <div class="chart-bar" style="height: 80%"></div>
                            <div class="chart-bar" style="height: 40%"></div>
                            <div class="chart-bar" style="height: 90%"></div>
                            <div class="chart-bar" style="height: 70%"></div>
                            <div class="chart-bar" style="height: 85%"></div>
                            <div class="chart-bar" style="height: 75%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Products Management -->
            <section class="products-management">
                <div class="section-header">
                    <h2>Product Management</h2>
                    <button class="btn btn-primary" id="addProductBtn">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>

                <div class="products-table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Advertisements Section -->
            <section class="ads-section">
                <div class="section-header">
                    <h2>Active Advertisements</h2>
                    <button class="btn btn-secondary" id="manageAdsBtn">
                        <i class="fas fa-edit"></i> Manage Ads
                    </button>
                </div>

                <div class="ads-grid" id="adsGrid">
                    <!-- Advertisements will be loaded here -->
                </div>
            </section>

            <!-- Recent Orders -->
            <section class="orders-section">
                <div class="section-header">
                    <h2>Recent Orders</h2>
                    <button class="btn btn-outline" id="viewAllOrdersBtn">
                        <i class="fas fa-list"></i> View All
                    </button>
                </div>

                <div class="orders-list" id="ordersList">
                    <!-- Recent orders will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Add Product Modal -->
    <div class="modal" id="addProductModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>Add New Product</h3>
                <button class="modal-close" id="addProductModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form class="product-form" id="productForm">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category</label>
                        <select id="productCategory" name="category" required>
                            <option value="pizza">Pizza</option>
                            <option value="pasta">Pasta</option>
                            <option value="salad">Salad</option>
                            <option value="dessert">Dessert</option>
                            <option value="drink">Drink</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price ($)</label>
                        <input type="number" id="productPrice" name="price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" name="description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL</label>
                        <input type="url" id="productImage" name="image" placeholder="https://...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="addProductModalCancel">Cancel</button>
                <button class="btn btn-primary" id="addProductModalSave">
                    <i class="fas fa-save"></i> Save Product
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
